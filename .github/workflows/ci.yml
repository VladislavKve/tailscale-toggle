name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            gir1.2-adw-1 \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            gir1.2-gtk-4.0 \
            policykit-1 \
            python3 \
            python3-gi \
            shellcheck \
            xauth \
            xvfb

      - name: Static checks
        run: |
          shellcheck install.sh uninstall.sh run.sh
          /usr/bin/python3 -B -m py_compile \
            tailscale_core.py tailscale_toggle.py tray_agent.py

      - name: Unit tests
        run: /usr/bin/python3 -B -m unittest discover -s tests -v

      - name: Safe GTK preview
        run: >-
          xvfb-run -a env GSK_RENDERER=cairo
          ./run.sh --preview needs-login --no-tray --quit-after 2

      - name: User-scoped install smoke test
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/share
          XDG_BIN_HOME: ${{ runner.temp }}/bin
          TAILSCALE_TOGGLE_INSTALL_DIR: ${{ runner.temp }}/app
          TAILSCALE_CLI: /bin/true
        run: |
          ./install.sh
          desktop-file-validate \
            "$XDG_DATA_HOME/applications/io.github.vladislavkve.TailscaleToggle.desktop"
          "$XDG_BIN_HOME/tailscale-toggle" \
            --preview connected --no-tray --quit-after 2
          ./uninstall.sh
